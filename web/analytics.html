<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dispatch Analytics</title>
  <style>
    :root {
      --ink: #0b1a2b;
      --muted: #6b7280;
      --panel: rgba(255, 255, 255, 0.96);
      --accent: #0ea5e9;
      --ok: #22c55e;
      --danger: #ef4444;
      --warn: #f59e0b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #e2e8f0, #cbd5f5 55%, #94a3b8);
      color: var(--ink);
    }
    header {
      padding: 20px 24px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    header h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 0.3px;
    }
    nav {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    nav a {
      text-decoration: none;
      color: #0f2f4f;
      background: rgba(15, 23, 42, 0.08);
      border: 1px solid rgba(15, 23, 42, 0.15);
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
    }
    .user-badge {
      background: rgba(15, 23, 42, 0.1);
      border: 1px solid rgba(15, 23, 42, 0.15);
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
    }
    .container {
      padding: 12px 24px 24px;
      display: grid;
      gap: 16px;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }
    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }
    .panel {
      background: var(--panel);
      border-radius: 16px;
      padding: 14px 16px;
      box-shadow: 0 16px 32px rgba(15, 23, 42, 0.2);
    }
    .panel h2 {
      margin: 0 0 12px;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: #0f2f4f;
    }
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }
    .stat {
      background: rgba(15, 23, 42, 0.05);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 12px;
      color: var(--muted);
    }
    .stat strong {
      display: block;
      margin-top: 4px;
      font-size: 16px;
      color: #0f2f4f;
    }
    canvas {
      width: 100%;
      height: 220px;
      display: block;
    }
    .table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    .table th,
    .table td {
      padding: 8px 6px;
      border-bottom: 1px solid rgba(15, 23, 42, 0.12);
      text-align: left;
      vertical-align: top;
    }
    .badge {
      padding: 2px 6px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      display: inline-block;
    }
    .badge.green { background: rgba(34, 197, 94, 0.2); color: #166534; }
    .badge.orange { background: rgba(245, 158, 11, 0.2); color: #92400e; }
    .badge.red { background: rgba(239, 68, 68, 0.2); color: #991b1b; }
    @media (max-width: 980px) {
      .grid-2, .grid-3, .stat-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Dispatch Analytics</h1>
      <div class="notice-meta" id="auth-status"></div>
    </div>
    <nav>
      <a href="notifications.html">Notifications</a>
      <a href="analytics.html">Analytics</a>
    </nav>
    <span class="user-badge" id="user-badge">Guest</span>
  </header>

  <div class="container">
    <section class="panel">
      <h2>Key Metrics</h2>
      <div class="stat-grid">
        <div class="stat">Total dispatches<strong id="metric-total">0</strong></div>
        <div class="stat">Avg route distance<strong id="metric-distance">0 m</strong></div>
        <div class="stat">Avg speed<strong id="metric-speed">0 m/tick</strong></div>
        <div class="stat">Active ambulances<strong id="metric-active">0</strong></div>
      </div>
    </section>

    <section class="grid-2">
      <div class="panel">
        <h2>Dispatches Over Time</h2>
        <canvas id="chart-dispatch"></canvas>
      </div>
      <div class="panel">
        <h2>Status Breakdown</h2>
        <canvas id="chart-status"></canvas>
      </div>
    </section>

    <section class="grid-2">
      <div class="panel">
        <h2>Route Distances</h2>
        <canvas id="chart-distance"></canvas>
      </div>
      <div class="panel">
        <h2>Ambulances by Hospital</h2>
        <canvas id="chart-hospital"></canvas>
      </div>
    </section>

    <section class="panel">
      <h2>Dispatch Feed</h2>
      <table class="table" id="dispatch-table">
        <thead>
          <tr>
            <th>Ambulance</th>
            <th>Hospital</th>
            <th>Status</th>
            <th>Pickup</th>
            <th>Dropoff</th>
            <th>Distance</th>
            <th>Speed</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </div>

  <script>
    const userBadge = document.getElementById("user-badge");
    const authStatus = document.getElementById("auth-status");
    const metricTotal = document.getElementById("metric-total");
    const metricDistance = document.getElementById("metric-distance");
    const metricSpeed = document.getElementById("metric-speed");
    const metricActive = document.getElementById("metric-active");
    const tableBody = document.querySelector("#dispatch-table tbody");

    function loadAuth() {
      const auth = JSON.parse(localStorage.getItem("dispatch_auth") || "null");
      if (auth && auth.email) {
        userBadge.textContent = auth.email;
        authStatus.textContent = "Authenticated. Analytics visible.";
        return auth;
      }
      userBadge.textContent = "Guest";
      authStatus.textContent = "Not authenticated. Sign in on Notifications page.";
      return null;
    }

    function getDispatches() {
      return JSON.parse(localStorage.getItem("dispatch_notifications") || "[]");
    }

    function formatCoords(coords) {
      if (!coords) return "--";
      return `${coords[0].toFixed(5)}, ${coords[1].toFixed(5)}`;
    }

    function drawLineChart(canvas, labels, values) {
      const ctx = canvas.getContext("2d");
      const width = canvas.width = canvas.clientWidth * 2;
      const height = canvas.height = canvas.clientHeight * 2;
      ctx.clearRect(0, 0, width, height);
      const padding = 40;
      const maxVal = Math.max(1, ...values);
      ctx.strokeStyle = "#94a3b8";
      ctx.lineWidth = 2;
      ctx.beginPath();
      values.forEach((val, i) => {
        const x = padding + (i / Math.max(1, values.length - 1)) * (width - padding * 2);
        const y = height - padding - (val / maxVal) * (height - padding * 2);
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      });
      ctx.stroke();
      ctx.fillStyle = "#0ea5e9";
      values.forEach((val, i) => {
        const x = padding + (i / Math.max(1, values.length - 1)) * (width - padding * 2);
        const y = height - padding - (val / maxVal) * (height - padding * 2);
        ctx.beginPath();
        ctx.arc(x, y, 6, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.fillStyle = "#334155";
      ctx.font = "20px Trebuchet MS";
      labels.forEach((label, i) => {
        const x = padding + (i / Math.max(1, labels.length - 1)) * (width - padding * 2);
        ctx.fillText(label, x - 10, height - 10);
      });
    }

    function drawBarChart(canvas, labels, values, color) {
      const ctx = canvas.getContext("2d");
      const width = canvas.width = canvas.clientWidth * 2;
      const height = canvas.height = canvas.clientHeight * 2;
      ctx.clearRect(0, 0, width, height);
      const padding = 40;
      const maxVal = Math.max(1, ...values);
      const barWidth = (width - padding * 2) / Math.max(1, values.length);
      ctx.fillStyle = color;
      values.forEach((val, i) => {
        const barHeight = (val / maxVal) * (height - padding * 2);
        const x = padding + i * barWidth;
        const y = height - padding - barHeight;
        ctx.fillRect(x, y, barWidth * 0.7, barHeight);
      });
      ctx.fillStyle = "#334155";
      ctx.font = "20px Trebuchet MS";
      labels.forEach((label, i) => {
        const x = padding + i * barWidth;
        ctx.fillText(label, x, height - 10);
      });
    }

    function drawDonutChart(canvas, labels, values) {
      const ctx = canvas.getContext("2d");
      const width = canvas.width = canvas.clientWidth * 2;
      const height = canvas.height = canvas.clientHeight * 2;
      ctx.clearRect(0, 0, width, height);
      const total = values.reduce((sum, v) => sum + v, 0) || 1;
      const colors = ["#22c55e", "#f59e0b", "#ef4444", "#0ea5e9"];
      let start = -Math.PI / 2;
      values.forEach((val, i) => {
        const angle = (val / total) * Math.PI * 2;
        ctx.beginPath();
        ctx.moveTo(width / 2, height / 2);
        ctx.fillStyle = colors[i % colors.length];
        ctx.arc(width / 2, height / 2, Math.min(width, height) / 3, start, start + angle);
        ctx.fill();
        start += angle;
      });
      ctx.globalCompositeOperation = "destination-out";
      ctx.beginPath();
      ctx.arc(width / 2, height / 2, Math.min(width, height) / 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalCompositeOperation = "source-over";
      ctx.fillStyle = "#334155";
      ctx.font = "20px Trebuchet MS";
      labels.forEach((label, i) => {
        ctx.fillText(`${label}: ${values[i]}`, 20, 30 + i * 24);
      });
    }

    function renderTable(items) {
      tableBody.innerHTML = "";
      items.forEach(item => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${item.ambulanceId || "--"}</td>
          <td>${item.hospitalName || "--"}</td>
          <td>${item.status || "--"}</td>
          <td>${formatCoords(item.pickupCoords)}</td>
          <td>${formatCoords(item.dropoffCoords)}</td>
          <td>${item.routeDistanceMeters || 0} m</td>
          <td>${item.speedMetersPerTick || 0} m/tick</td>
        `;
        tableBody.appendChild(row);
      });
    }

    function renderAnalytics() {
      const auth = loadAuth();
      if (!auth) return;
      const items = getDispatches();
      metricTotal.textContent = String(items.length);
      const avgDistance = items.length ? Math.round(items.reduce((sum, i) => sum + (i.routeDistanceMeters || 0), 0) / items.length) : 0;
      const avgSpeed = items.length ? Math.round(items.reduce((sum, i) => sum + (i.speedMetersPerTick || 0), 0) / items.length) : 0;
      metricDistance.textContent = `${avgDistance} m`;
      metricSpeed.textContent = `${avgSpeed} m/tick`;
      const activeCount = items.filter(item => (item.status || "").toLowerCase().includes("route")).length;
      metricActive.textContent = String(activeCount);

      const timeBuckets = {};
      items.slice(0, 20).forEach(item => {
        const stamp = new Date(item.createdAt || Date.now());
        const label = `${stamp.getHours()}:${String(stamp.getMinutes()).padStart(2, "0")}`;
        timeBuckets[label] = (timeBuckets[label] || 0) + 1;
      });
      const timeLabels = Object.keys(timeBuckets).reverse();
      const timeValues = timeLabels.map(label => timeBuckets[label]);
      drawLineChart(document.getElementById("chart-dispatch"), timeLabels, timeValues);

      const statusCounts = { enroute: 0, transport: 0, arrived: 0 };
      items.forEach(item => {
        const status = (item.status || "").toLowerCase();
        if (status.includes("patient")) statusCounts.enroute += 1;
        else if (status.includes("transport")) statusCounts.transport += 1;
        else statusCounts.arrived += 1;
      });
      drawDonutChart(
        document.getElementById("chart-status"),
        ["En route", "Transport", "Other"],
        [statusCounts.enroute, statusCounts.transport, statusCounts.arrived]
      );

      const distanceItems = items.slice(0, 8).reverse();
      drawBarChart(
        document.getElementById("chart-distance"),
        distanceItems.map(item => item.ambulanceId || "AMB"),
        distanceItems.map(item => item.routeDistanceMeters || 0),
        "#0ea5e9"
      );

      const hospitalCounts = {};
      items.forEach(item => {
        const hospital = item.hospitalName || "Unknown";
        hospitalCounts[hospital] = (hospitalCounts[hospital] || 0) + 1;
      });
      const hospitalLabels = Object.keys(hospitalCounts).slice(0, 6);
      const hospitalValues = hospitalLabels.map(label => hospitalCounts[label]);
      drawBarChart(
        document.getElementById("chart-hospital"),
        hospitalLabels,
        hospitalValues,
        "#22c55e"
      );

      renderTable(items.slice(0, 12));
    }

    renderAnalytics();
    window.addEventListener("storage", event => {
      if (event.key === "dispatch_notifications" || event.key === "dispatch_auth") {
        renderAnalytics();
      }
    });
  </script>
</body>
</html>
